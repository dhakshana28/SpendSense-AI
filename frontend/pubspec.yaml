  timezone: ^0.11.0
  connectivity_plus: ^7.3.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.4+2
  archive: ^4.0.7
  xml: ^7.0.1

