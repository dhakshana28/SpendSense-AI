  intl: ^0.20.3
  uuid: ^4.0.0
  fl_chart: ^1.2.0
  google_fonts: ^8.2.0
  shimmer: ^3.0.0
  flutter_slidable: ^4.0.3
  lottie: ^3.5.1
  google_generative_ai: ^0.4.7
  google_mlkit_text_recognition: ^0.16.0
