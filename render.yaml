services:
  - type: web
    name: spendsense-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: BACKEND_AUTH_KEY
        value: ss_key_8e4f9b2d1c6a7e305928416d8a7c2e0b
      - key: PYTHON_VERSION
        value: "3.11.9"
